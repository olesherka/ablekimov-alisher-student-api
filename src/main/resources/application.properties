spring.application.name=ablekimov-alisher-student-api

# Personalized application URL: http://localhost:8080/ablekimov-alisher
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/ablekimov-alisher}

# Database settings come from environment variables (set in docker-compose.yml / .env).
# Defaults are only for running locally without Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ablekimov_alisher_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Student information shown on the home page and in the logs
student.full-name=Ablekimov Alisher
student.id=37637
student.group=IT2-2312
student.github=https://github.com/olesherka
